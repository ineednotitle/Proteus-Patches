name: Publish replacement v2.2.2

# One-off replacement for the withdrawn v2.2.2 release. This branch trigger
# builds exactly the changes requested for the replacement.
on:
  push:
    branches:
      - arena/e51b332d-proteus-patches

permissions:
  contents: write
  packages: read

jobs:
  publish:
    name: Test and publish v2.2.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Test and build Android bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:testPermissionRemoval generatePatchesList --stacktrace > build.log 2>&1 || {
            tail -150 build.log
            python3 - <<'PY'
          from pathlib import Path
          for line in Path('build.log').read_text(errors='replace').splitlines()[-150:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit 1
          }
          tail -25 build.log
          jq '.version="2.2.2"' patches-list.json > patches-list.json.tmp
          mv patches-list.json.tmp patches-list.json
          python3 -m unittest discover -s .github/scripts -p 'test_verify_android_bundle.py'
          python3 .github/scripts/verify_android_bundle.py patches/build/libs/patches-2.2.2.mpp 2.2.2 --patch-list patches-list.json

      - name: Update release metadata and README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import datetime, json
          from pathlib import Path
          path = Path('patches-bundle.json')
          path.write_text(json.dumps({
              'created_at': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z'),
              'description': 'Replacement v2.2.2: verified Android bundle and improved universal permission controls.',
              'download_url': 'https://github.com/ineednotitle/Proteus-Patches/releases/download/v2.2.2/patches-2.2.2.mpp',
              'signature_download_url': '',
              'version': '2.2.2',
          }, indent=2) + '\n')
          PY
          python3 .github/scripts/generate_patches_readme.py "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" patches-list.json README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches-bundle.json patches-list.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: regenerate replacement v2.2.2 metadata [skip ci]'
            git push origin HEAD:arena/e51b332d-proteus-patches
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish replacement release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Never overwrite a release or move a tag changed by someone else.
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.tag_name == "v2.2.2")] | length')
          if [ "$count" != 0 ]; then
            echo 'A v2.2.2 release already exists; refusing to replace it.' >&2
            exit 1
          fi
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.2.2" --jq '.object.sha')
          if [ "$tag_sha" = '5e492690aa4176d15abc15c984f71aace01ea9bb' ]; then
            # Repoint the withdrawn release's existing tag to the tested source,
            # so GitHub's automatically generated source archives are correct.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v2.2.2" -f sha="$RELEASE_SHA" -F force=true > /dev/null
          elif [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "v2.2.2 points to unexpected commit $tag_sha; refusing to move it." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## Replacement v2.2.2

          This replaces the withdrawn 2.2.2 bundle. The Android bundle is built and checked for a non-empty DEX file after patch metadata generation; the permission policy and manifest tests are also run before publication.

          - Universal permissions: category switches with clear warnings, short Android permission names, validated lists, and documented keep/extra/legacy precedence.
          - Corrected nearby Wi-Fi permission matching and restricted removal to actual manifest permission declarations.
          - Clarified screenshot patch limitations and added a universal-patches usage guide.

          **Important:** The permission patch is off by default, but its category switches are all on when enabled. Turn off categories needed by your app. Removing permissions can break features. Please test patched apps on your device.

          If you installed the withdrawn 2.2.2 bundle, refresh the remote source or re-import the replacement asset.
          EOF
          gh release create v2.2.2 --verify-tag --latest --title 'Proteus Patches v2.2.2' --notes-file release-notes.md patches/build/libs/patches-2.2.2.mpp
