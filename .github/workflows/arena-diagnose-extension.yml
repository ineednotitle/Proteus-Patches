name: Diagnose extension dex

on:
  push:
    branches:
      - arena/663d48dc-proteus-patches
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid --stacktrace > build.log 2>&1 || { tail -80 build.log; exit 1; }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect compiled helper and publish dumps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MPE=$(find extensions/extension/build -name '*.mpe' -type f | head -1)
          MERGED=$(find extensions/extension/build -path '*mergeDexRelease*' -name 'classes.dex' | head -1)
          DEXDUMP=$(find "$ANDROID_HOME" -name dexdump -type f 2>/dev/null | head -1)
          {
            echo "MPE=$MPE"
            echo "MERGED=$MERGED"
            echo "DEXDUMP=$DEXDUMP"
            echo "=== file types ==="
            file "$MPE" "$MERGED"
            echo "=== javap -c -p -constants (full) ==="
            find extensions/extension/build -name 'RedditContentFilterHelper.class' -exec javap -c -p -constants {} \;
            echo "=== dexdump .mpe (placeholder context) ==="
            "$DEXDUMP" -d "$MPE" 2>/dev/null | grep -n -B12 -A24 'PROTEUS_REDDIT_FILTER_CONFIG_V1\|RedditContentFilterHelper' | head -500
            echo "=== dexdump merged classes.dex (placeholder context) ==="
            "$DEXDUMP" -d "$MERGED" 2>/dev/null | grep -n -B12 -A24 'PROTEUS_REDDIT_FILTER_CONFIG_V1\|RedditContentFilterHelper' | head -500
          } > diag.txt 2>&1 || true
          wc -l diag.txt
          git config user.email "ci@users.noreply.github.com"
          git config user.name "arena-ci"
          git add -f diag.txt
          git commit -m "diag: full extension dump [skip ci]" || true
          git push origin HEAD:arena/663d48dc-proteus-patches || true
