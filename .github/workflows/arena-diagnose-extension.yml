name: Diagnose extension dex

on:
  push:
    branches:
      - arena/663d48dc-proteus-patches
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid --stacktrace > build.log 2>&1 || { tail -80 build.log; exit 1; }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect compiled helper and publish diag.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "=== artifacts ==="
            find extensions/extension/build -type f \( -name '*.mpe' -o -name '*.dex' -o -name '*.jar' \) | head -40
            echo "=== javap -c -p RedditContentFilterHelper.class ==="
            find extensions/extension/build -name 'RedditContentFilterHelper.class' -exec javap -c -p {} \; | sed -n '1,260p'
            echo "=== DEX dump around placeholder ==="
            DEXDUMP=$(find "$ANDROID_HOME" -name dexdump -type f 2>/dev/null | head -1)
            echo "dexdump=$DEXDUMP"
            MPE=$(find extensions/extension/build -name '*.mpe' -type f | head -1)
            echo "mpe=$MPE"
            if [ -n "$MPE" ] && [ -n "$DEXDUMP" ]; then
              rm -rf /tmp/mpe && mkdir -p /tmp/mpe
              unzip -o -q "$MPE" -d /tmp/mpe
              for dex in $(find /tmp/mpe -name '*.dex'); do
                echo "--- $dex ---"
                "$DEXDUMP" -d "$dex" 2>/dev/null | grep -n -B10 -A20 'PROTEUS_REDDIT_FILTER_CONFIG_V1\|RedditContentFilterHelper' | head -400
              done
            fi
          } > diag.txt 2>&1 || true
          wc -l diag.txt
          git config user.email "ci@users.noreply.github.com"
          git config user.name "arena-ci"
          git add -f diag.txt
          git commit -m "diag: extension dump [skip ci]" || true
          git push origin HEAD:arena/663d48dc-proteus-patches || true
