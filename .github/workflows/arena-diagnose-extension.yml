name: Diagnose extension dex

on:
  push:
    branches:
      - arena/663d48dc-proteus-patches
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid --stacktrace > build.log 2>&1 || { tail -80 build.log; exit 1; }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect compiled helper (javap + dexdump)
        run: |
          {
            echo "=== artifacts ==="
            find extensions/extension/build -type f \( -name '*.mpe' -o -name '*.dex' -o -name '*.jar' \) | head -40
            echo "=== javap -c -p RedditContentFilterHelper.class ==="
            find extensions/extension/build -name 'RedditContentFilterHelper.class' -exec javap -c -p {} \; | sed -n '1,220p'
            echo "=== DEX dump around placeholder ==="
            DEXDUMP=$(find "$ANDROID_HOME" -name dexdump -type f 2>/dev/null | head -1)
            echo "dexdump=$DEXDUMP"
            MPE=$(find extensions/extension/build -name '*.mpe' -type f | head -1)
            echo "mpe=$MPE"
            if [ -n "$MPE" ] && [ -n "$DEXDUMP" ]; then
              rm -rf /tmp/mpe && mkdir -p /tmp/mpe
              unzip -o -q "$MPE" -d /tmp/mpe
              for dex in $(find /tmp/mpe -name '*.dex'); do
                echo "--- $dex ---"
                "$DEXDUMP" -d "$dex" 2>/dev/null | grep -n -B8 -A16 'PROTEUS_REDDIT_FILTER_CONFIG_V1\|Class descriptor.*RedditContentFilterHelper' | head -300
              done
            fi
          } > diag.txt 2>&1
          python3 - <<'PY'
          import pathlib
          lines = pathlib.Path('diag.txt').read_text(errors='replace').splitlines()
          for start in range(0, len(lines), 40):
              chunk = '\n'.join(lines[start:start + 40])
              escaped = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::DIAG {start // 40}: {escaped}')
          PY
