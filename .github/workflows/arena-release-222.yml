name: Arena release v2.2.2

on:
  push:
    branches:
      - arena/663d48dc-proteus-patches
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  release:
    name: Build, regenerate metadata and release v2.2.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android patch bundle
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid --stacktrace > build.log 2>&1 && tail -5 build.log && exit 0
          echo "=== BUILD FAILED ==="
          tail -100 build.log
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Surface full build log on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          lines = pathlib.Path('build.log').read_text(errors='replace').splitlines()
          for start in range(0, len(lines), 40):
              chunk = '\n'.join(lines[start:start + 40])
              escaped = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::BUILDLOG {start // 40}: {escaped}')
          PY

      - name: Regenerate patch list and README from source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew generatePatchesList --stacktrace > gen.log 2>&1 || { tail -100 gen.log; exit 1; }
          jq --arg v 2.2.2 '.version=$v' patches-list.json > patches-list.json.tmp && mv patches-list.json.tmp patches-list.json
          python3 .github/scripts/generate_patches_readme.py "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" patches-list.json README.md
          python3 - <<'PY'
          import json
          d = json.load(open('patches-list.json'))
          assert d['version'] == '2.2.2', d['version']
          e = next(x for x in d['patches'] if x['name'] == 'Remove dangerous permissions')
          assert len(e['options']) == 19, len(e['options'])
          print('metadata OK: version 2.2.2, permission options =', len(e['options']))
          PY
          git config user.email "ci@users.noreply.github.com"
          git config user.name "arena-ci"
          git add patches-list.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate v2.2.2 metadata [skip ci]"
            git push origin HEAD:arena/663d48dc-proteus-patches
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp patches/build/libs/patches-2.2.2.mpp release-assets/patches-2.2.2.mpp
          zip -r -q release-assets/proteus-universal-2.2.2.zip \
            patches/src/main/kotlin/app/template/patches/shared \
            UNIVERSAL_PATCH_AUDIT.md
          cat > release-notes.md <<'EOF'
          ## v2.2.2 — Universal patches: optimized & easier to use

          All 24 universal patches now share a single optimization layer:

          * `UniversalUtils.kt` — single-pass manifest DOM traversal, tolerant list parsing (`parseTokens` + `RELAXED_LIST_VALIDATOR`), consistent `[Proteus/Universal]` logging and a `guarded()` fail-safe wrapper.
          * Six manifest patches refactored to one DOM pass; every universal patch now emits the shared log prefix.

          ### `Remove dangerous permissions` (main usability target)
          * Replaced the one long comma-separated option with **16 category switches** (package visibility, phone, accounts, location, contacts, mic, camera, storage, SMS, calendar, sensors, nearby devices, screen-capture detection, ad ID, AdServices, notifications).
          * **All categories ON by default** (aggressive), as selected. The patch remains off by default.
          * New `Permissions to keep` and `Extra permissions to remove` lists, plus a legacy `Advanced: exact removal list` override for existing configs.
          * AdServices is now a toggle instead of an unconditional removal.

          Assets:
          * `patches-2.2.2.mpp` — Morphe patch bundle.
          * `proteus-universal-2.2.2.zip` — universal patch sources + updated audit.

          `patches-list.json` and README were regenerated from source by CI for this release. Aggressive defaults can break camera, storage, notifications or SMS features; use the keep-list or category switches to exempt them.
          EOF
          ls -lh release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.2.2 >/dev/null 2>&1; then
            echo "Release v2.2.2 already exists; skipping."
            exit 0
          fi
          gh release create v2.2.2 \
            --target "${{ env.RELEASE_SHA }}" \
            --title "Proteus Patches v2.2.2" \
            --notes-file release-notes.md \
            release-assets/patches-2.2.2.mpp \
            release-assets/proteus-universal-2.2.2.zip
