name: MUBI branch build

on:
  push:
    branches:
      - 'arena/e07470db-halo-patches'

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build .mpp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android patch bundle
        run: |
          set +e
          ./gradlew buildAndroid --stacktrace > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -nE "^e: |error:|What went wrong|Could not|Unresolved|Caused by" build.log | head -40 | while read -r line; do
              echo "::error::$line"
            done
            tail -80 build.log
            exit 1
          fi
          tail -5 build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .mpp artifact
        uses: actions/upload-artifact@v4
        with:
          name: patches-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error
