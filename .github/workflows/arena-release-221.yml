name: Arena release v2.2.1

on:
  push:
    branches:
      - arena/663d48dc-proteus-patches
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  release:
    name: Build, verify and release v2.2.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android patch bundle
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid --stacktrace > build.log 2>&1 && tail -5 build.log && exit 0
          echo "=== BUILD FAILED ==="
          tail -80 build.log
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Surface full build log on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          lines = pathlib.Path('build.log').read_text(errors='replace').splitlines()
          for start in range(0, len(lines), 40):
              chunk = '\n'.join(lines[start:start + 40])
              escaped = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::BUILDLOG {start // 40}: {escaped}')
          PY

      - name: Verify replaceable placeholder const-string in extension dex
        run: |
          MPE=$(find extensions/extension/build -name '*.mpe' -type f | head -1)
          DEXDUMP=$(find "$ANDROID_HOME" -name dexdump -type f 2>/dev/null | head -1)
          echo "mpe=$MPE dexdump=$DEXDUMP"
          "$DEXDUMP" -d "$MPE" > /tmp/extension-dex.txt
          echo "=== placeholder instructions ==="
          grep -n 'PROTEUS_REDDIT_FILTER_CONFIG_V1' /tmp/extension-dex.txt | head -20
          if ! grep -q 'const-string .*"PROTEUS_REDDIT_FILTER_CONFIG_V1"' /tmp/extension-dex.txt; then
            echo "::error::No replaceable const-string placeholder found in extension dex"
            exit 1
          fi
          echo "OK: placeholder is a real const-string (not only an encoded field value)"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp patches/build/libs/patches-2.2.1.mpp release-assets/patches-2.2.1.mpp
          zip -j release-assets/proteus-reddit-patches-2.2.1.zip \
            patches/src/main/kotlin/app/template/patches/reddit/automod/BlockAutoModCommentsPatch.kt \
            patches/src/main/kotlin/app/template/patches/reddit/contentfilter/ContentFiltersPatch.kt \
            patches/src/main/kotlin/app/template/patches/reddit/shared/RedditListingChildren.kt \
            extensions/extension/src/main/java/app/template/extension/extension/RedditContentFilterHelper.java
          cat > release-notes.md <<'EOF'
          ## v2.2.1 — Content filters fingerprint fix

          Fixes the `Failed to match the fingerprint ... <clinit>` crash reported on Reddit 2026.42.0 / Patcher 2.2.0 / Manager 2.4.0.

          D8 encodes a `static final` String initializer as a DEX static-field value and removes the `<clinit>` `const-string`, so the old `<clinit>` fingerprint had no instruction to match. The helper now returns the placeholder from `patchConfig()`, and the patch rewrites every matching `const-string` directly (the same mechanism as `replaceStringPatch`). The helper also no-ops any value without five pipe-separated fields, so the unpatched placeholder is still safe.

          Assets:
          * `patches-2.2.1.mpp` — Morphe patch bundle.
          * `proteus-reddit-patches-2.2.1.zip` — the new patch sources and extension helper.

          Both Reddit patches remain off by default; configure the content-filter options at patch time. Server-side Reddit filters still cannot be bypassed.
          EOF
          ls -lh release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.2.1 >/dev/null 2>&1; then
            echo "Release v2.2.1 already exists; skipping."
            exit 0
          fi
          gh release create v2.2.1 \
            --target "${{ github.sha }}" \
            --title "Proteus Patches v2.2.1" \
            --notes-file release-notes.md \
            release-assets/patches-2.2.1.mpp \
            release-assets/proteus-reddit-patches-2.2.1.zip
