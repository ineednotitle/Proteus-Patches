name: Arena release bundle (v2.2.0)

# Builds the .mpp from this branch (the sandbox has no JDK/Android SDK) and
# publishes it as a GitHub release together with the new Reddit patch sources.
on:
  push:
    branches:
      - arena/663d48dc-proteus-patches
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  release:
    name: Build and release v2.2.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android patch bundle
        run: |
          ./gradlew buildAndroid --stacktrace > build.log 2>&1 && tail -5 build.log && exit 0
          echo "=== ROOT CAUSE (first relevant lines) ==="
          grep -nE "What went wrong|> |error:|e: |Exception|Caused by|Could not|Failed to|Unresolved" build.log | head -25 | while read -r line; do
            echo "::error::$line"
            echo "$line"
          done
          echo "=== LAST 60 LINES OF GRADLE LOG ==="
          tail -60 build.log
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp patches/build/libs/patches-2.2.0.mpp release-assets/patches-2.2.0.mpp
          zip -j release-assets/proteus-reddit-patches-2.2.0.zip \
            patches/src/main/kotlin/app/template/patches/reddit/automod/BlockAutoModCommentsPatch.kt \
            patches/src/main/kotlin/app/template/patches/reddit/contentfilter/ContentFiltersPatch.kt \
            patches/src/main/kotlin/app/template/patches/reddit/shared/RedditListingChildren.kt \
            extensions/extension/src/main/java/app/template/extension/extension/RedditContentFilterHelper.java
          cat > release-notes.md <<'EOF'
          ## v2.2.0 — Reddit AutoMod & content filters

          New opt-in patches for `com.reddit.frontpage`:

          * **Block AutoMod comments** — hides every u/AutoModerator comment (including stickied ones), keeps AutoModerator posts.
          * **Content filters** — patch-time keyword / community / author / flair filters plus a local bypass for NSFW / spoiler / quarantine gates and over-18 account flags.

          Assets:
          * `patches-2.2.0.mpp` — Morphe patch bundle.
          * `proteus-reddit-patches-2.2.0.zip` — the new patch sources and extension helper.

          Server-side Reddit filters cannot be bypassed. Both patches are off by default; configure the content-filter options at patch time.
          EOF
          ls -lh release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.2.0 >/dev/null 2>&1; then
            echo "Release v2.2.0 already exists; skipping."
            exit 0
          fi
          gh release create v2.2.0 \
            --target "${{ github.sha }}" \
            --title "Proteus Patches v2.2.0" \
            --notes-file release-notes.md \
            release-assets/patches-2.2.0.mpp \
            release-assets/proteus-reddit-patches-2.2.0.zip
