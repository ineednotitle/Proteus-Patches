name: Publish v2.2.3

on:
  push:
    branches:
      - arena/e51b332d-proteus-patches

permissions:
  contents: write
  packages: read

jobs:
  publish:
    name: Verify and publish v2.2.3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and build Android bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:testPermissionRemoval :extensions:extension:testReleaseUnitTest generatePatchesList --stacktrace > build.log 2>&1 || {
            tail -160 build.log
            exit 1
          }
          tail -25 build.log
          jq '.version="2.2.3"' patches-list.json > patches-list.json.tmp
          mv patches-list.json.tmp patches-list.json
          python3 -m unittest discover -s .github/scripts -p 'test_verify_android_bundle.py'
          python3 .github/scripts/verify_android_bundle.py patches/build/libs/patches-2.2.3.mpp 2.2.3 --patch-list patches-list.json
      - name: Update release metadata
        run: |
          python3 - <<'PY'
          import datetime, json
          from pathlib import Path
          Path('patches-bundle.json').write_text(json.dumps({
              'created_at': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z'),
              'description': 'v2.2.3: experimental Pinterest video downloads.',
              'download_url': 'https://github.com/ineednotitle/Proteus-Patches/releases/download/v2.2.3/patches-2.2.3.mpp',
              'signature_download_url': '',
              'version': '2.2.3',
          }, indent=2) + '\n')
          PY
          python3 .github/scripts/generate_patches_readme.py "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" patches-list.json README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches-bundle.json patches-list.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: generate v2.2.3 metadata [skip ci]'
            git push origin HEAD:arena/e51b332d-proteus-patches
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.2.3" >/dev/null 2>&1; then
            echo 'v2.2.3 tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v2.2.3 -f sha="$RELEASE_SHA" > /dev/null
          cat > release-notes.md <<'EOF'
          ## Pinterest video downloads (experimental)

          - Adds a separate, default-off **Enable video download** patch. It attempts to download an available Pinterest MP4 rather than the video's cover image. Enable it explicitly alongside the image eligibility patch.
          - Image Pins continue to use Pinterest's image downloader. Streaming-only videos, private media, and multi-page Pins may not be downloadable.
          - The patch was adapted from a Pinterest 14.39.0 implementation and has not been tested on a device or against the 14.41.0 APK. It may fail to apply or work with that version. Please test before relying on it.

          Android bundle structure, Pinterest URL-selection unit tests, and permission tests were checked before publishing. The unreleased Mereframe changes are not included.
          EOF
          gh release create v2.2.3 --verify-tag --latest --title 'Proteus Patches v2.2.3' --notes-file release-notes.md patches/build/libs/patches-2.2.3.mpp
