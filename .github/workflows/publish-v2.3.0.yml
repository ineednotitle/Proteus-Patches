name: Publish v2.3.0 re-cut pre-release

on:
  push:
    branches:
      - arena/c7d523d0-proteus-patches
    paths:
      - 'patches-bundle.json'
      - '.github/release-notes-v2.3.0-recut.md'
      - '.github/workflows/publish-v2.3.0.yml'

permissions:
  contents: write

jobs:
  publish:
    name: Build, verify, and publish v2.3.0 pre-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android patch bundle
        run: |
          ./gradlew buildAndroid --stacktrace > build.log 2>&1 && tail -10 build.log && exit 0
          echo "=== GREP: exception headers ==="
          grep -n -m 20 -E "What went wrong|FAILURE:|Caused by|Exception|Error|(^|[[:space:]])e:" build.log || true
          tail -n 40 build.log
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Pinterest and Instagram extension helpers
        run: |
          bash .github/scripts/test_pinterest_video_urls.sh
          bash .github/scripts/test_instagram_extension.sh

      - name: Run patches verification tasks
        run: ./gradlew :patches:check --console=plain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate patch metadata and README catalog
        run: |
          ./gradlew generatePatchesList --stacktrace
          python3 .github/scripts/generate_patches_readme.py "$GITHUB_REPOSITORY" "main" patches-list.json README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify bundle and metadata
        run: |
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          test "$VERSION" = "2.3.0"
          ARTIFACT="patches/build/libs/patches-${VERSION}.mpp"
          test -f "$ARTIFACT"
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/verify_patch_source.py patches-bundle.json "$VERSION"
          python3 .github/scripts/verify_android_bundle.py "$ARTIFACT" "$VERSION" --patch-list patches-list.json
          sha256sum "$ARTIFACT"

      - name: Commit updated catalog metadata if changed
        id: metadata
        run: |
          if [ -n "$(git status --porcelain patches-list.json README.md)" ]; then
            git config user.name "ineednotitle"
            git config user.email "100122698+ineednotitle@users.noreply.github.com"
            git add patches-list.json README.md
            git commit -m "chore(release): update v2.3.0 patch catalog and README [skip ci]"
            git push origin "HEAD:arena/c7d523d0-proteus-patches"
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.7.0
        with:
          name: patches-2.3.0-recut
          path: |
            patches/build/libs/patches-2.3.0.mpp
            patches-list.json
          if-no-files-found: error

      - name: Upload gradle error log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.7.0
        with:
          name: gradle-error-log
          path: build.log
          if-no-files-found: ignore

      - name: Delete previous v2.3.0 release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.3.0 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || echo "No existing v2.3.0 release"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v2.3.0" 2>/dev/null || true
          sleep 3

      - name: Create v2.3.0 re-cut pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_SHA="${{ steps.metadata.outputs.release_sha }}"
          BUNDLE="patches/build/libs/patches-2.3.0.mpp"
          BUNDLE_SHA256=$(sha256sum "$BUNDLE" | cut -d' ' -f1)
          BUNDLE_SIZE=$(wc -c < "$BUNDLE" | tr -d ' ')
          cp .github/release-notes-v2.3.0-recut.md "$RUNNER_TEMP/release-notes.md"
          printf '\n### Build details\n- Build commit: `%s` ([CI run](https://github.com/%s/actions/runs/%s))\n- Bundle: `patches-2.3.0.mpp` (%s bytes)\n- SHA-256: `%s`\n' \
            "$RELEASE_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$BUNDLE_SIZE" "$BUNDLE_SHA256" >> "$RUNNER_TEMP/release-notes.md"
          gh release create v2.3.0 "$BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Proteus Patches v2.3.0 (pre-release re-cut)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease

      - name: Verify published pre-release and asset digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE="patches/build/libs/patches-2.3.0.mpp"
          BUNDLE_SHA256=$(sha256sum "$BUNDLE" | cut -d' ' -f1)
          BUNDLE_SIZE=$(wc -c < "$BUNDLE" | tr -d ' ')
          gh release view v2.3.0 --repo "$GITHUB_REPOSITORY" --json tagName,name,isPrerelease,isDraft,assets,targetCommitish
          ASSET_DIGEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.3.0" --jq '.assets[] | select(.name=="patches-2.3.0.mpp") | .digest')
          ASSET_SIZE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.3.0" --jq '.assets[] | select(.name=="patches-2.3.0.mpp") | .size')
          echo "Uploaded asset digest=$ASSET_DIGEST size=$ASSET_SIZE"
          test "$ASSET_DIGEST" = "sha256:${BUNDLE_SHA256}"
          test "$ASSET_SIZE" = "$BUNDLE_SIZE"
